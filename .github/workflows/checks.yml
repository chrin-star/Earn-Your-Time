name: MVP checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-android:
    runs-on: ubuntu-latest
    env:
      FOCUSFEED_UNSIGNED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build installable ARM debug APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64
      - name: Verify ARM libraries in debug APK
        run: |
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -E 'lib/(armeabi-v7a|arm64-v8a)/'
      - run: cd android && ./gradlew :app:testDebugUnitTest
      - name: Build universal ARM release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - name: Verify ARM libraries in release APK
        run: |
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/(armeabi-v7a|arm64-v8a)/'
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks-arm
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
