name: MVP checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure permanent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secreto de GitHub: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/earn-your-time-upload.jks"
          mkdir -p .private
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/earn-your-time-upload.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > .private/key.properties
          chmod 600 .private/key.properties "$RUNNER_TEMP/earn-your-time-upload.jks"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: Build installable ARM debug APK
        run: flutter build apk --debug --target-platform android-arm,android-arm64
      - name: Verify debug APK signature and ARM libraries
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk
          unzip -l build/app/outputs/flutter-apk/app-debug.apk | grep -E 'lib/(armeabi-v7a|arm64-v8a)/'
      - run: cd android && ./gradlew :app:testDebugUnitTest
      - name: Build signed universal ARM release APK
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - name: Verify release APK signature and ARM libraries
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/(armeabi-v7a|arm64-v8a)/'
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks-arm
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
